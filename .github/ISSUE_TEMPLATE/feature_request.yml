name: Feature request
description: Suggest an addition to the IOWAP MCP toolkit
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Which agent workflow is blocked or awkward today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should the toolset do? Keep destructive surface out of scope for now.
    validations:
      required: true